name: Android Debug APK

# Builds a debug APK for private device testing and uploads it as a workflow artifact.
# Never deploys: no Pages permissions, no secrets. Signed only with a throwaway debug keystore generated in the job.
# workflow_dispatch needs the file on the default branch, so pushes to this dedicated branch also run it.

on:
  workflow_dispatch:
  push:
    branches: ['android/ci-debug-apk']

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"
  BUILD_TOOLS: "34.0.0"
  ANDROID_PLATFORM: "android-34"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Godot (editor only, checksum-verified)
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          F="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$F" "$BASE/$F"
          curl -fsSL --retry 3 -o SHA512-SUMS.txt "$BASE/SHA512-SUMS.txt"
          grep " $F\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$F"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          rm -f "$F" SHA512-SUMS.txt
          godot --version

      - name: Python test dependencies
        run: python3 -m pip install --break-system-packages numpy==2.5.3 pillow==12.3.0

      - name: Import project
        run: godot --headless --editor --import --quit

      - name: Run all test suites
        run: GODOT=godot tools/run_tests.sh "$RUNNER_TEMP/suite"

      - name: Sprite pipeline test
        run: |
          GODOT=godot tools/test_pipeline.sh
          rm -rf tests/fixtures/_pipeline

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs
          path: ${{ runner.temp }}/suite
          retention-days: 7

  apk:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Godot and Android export templates (checksum-verified)
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 3 -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fsSL --retry 3 -o SHA512-SUMS.txt "$BASE/SHA512-SUMS.txt"
          grep " Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip\$" SHA512-SUMS.txt | sed 's| .*|  godot.zip|' | sha512sum -c -
          grep " Godot_v${GODOT_VERSION}-stable_export_templates.tpz\$" SHA512-SUMS.txt | sed 's| .*|  templates.tpz|' | sha512sum -c -
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATES"
          unzip -q -j templates.tpz 'templates/android_*' 'templates/version.txt' -d "$TEMPLATES"
          rm -f godot.zip templates.tpz SHA512-SUMS.txt
          godot --version
          ls -l "$TEMPLATES"

      - name: Android SDK packages and debug keystore
        run: |
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "build-tools;${BUILD_TOOLS}" "platforms;${ANDROID_PLATFORM}" > /dev/null
          KS="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          # Godot 4.3+ names the file per minor version; the -4 name covers older lookups.
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.4.tres editor_settings-4.tres; do
            cat > "$HOME/.config/godot/$f" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/debug_keystore = "$KS"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Import project
        run: godot --headless --editor --import --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/soul-ascension-debug.apk
          # Godot can exit 0 after a failed export, so require the file.
          test -s build/soul-ascension-debug.apk

      - name: Verify APK
        run: |
          APK=build/soul-ascension-debug.apk
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|uses-permission)"
          (cd build && sha256sum soul-ascension-debug.apk | tee soul-ascension-debug.apk.sha256)
          {
            echo "### Debug APK"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- File: \`soul-ascension-debug.apk\`"
            echo "- Size: $(stat -c %s "$APK") bytes"
            echo "- SHA-256: \`$(cut -d' ' -f1 build/soul-ascension-debug.apk.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soul-ascension-debug-apk
          path: |
            build/soul-ascension-debug.apk
            build/soul-ascension-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
