name: Web Preview

# Builds the Godot web export and publishes it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cantor_textures:
        description: "Hollow Cantor texture variant for this web build (both stay in the repo for comparison)"
        type: choice
        default: lossless
        options: [lossless, vram]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build:
    runs-on: ubuntu-latest
    # Verified locally: import ~2.2 min + full test runner ~9 min + pipeline test; web export time is not measured, so keep headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and web export templates
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 3 -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot 2>/dev/null || sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot 2>/dev/null || sudo chmod +x /usr/local/bin/godot
          TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATES"
          unzip -q -j templates.tpz 'templates/web_*' 'templates/version.txt' -d "$TEMPLATES"
          rm -f godot.zip templates.tpz
          godot --version
          ls "$TEMPLATES"

      - name: Import project
        run: godot --headless --editor --import --quit

      # Python dependencies come before any test: tools/run_tests.sh also runs the tools/test_*.py self-tests.
      - name: Python test dependencies
        run: python3 -m pip install --break-system-packages numpy pillow

      - name: Run all test suites
        # Glob discovery of tests/test_*.gd plus tools/test_*.py; fails if any discovered test did not run or failed.
        run: GODOT=godot tools/run_tests.sh "$RUNNER_TEMP/suite"

      - name: Sprite pipeline test
        run: |
          GODOT=godot tools/test_pipeline.sh
          rm -rf tests/fixtures/_pipeline

      - name: Cantor textures for the web build
        # Frames are VRAM-compressed in the repo (Android keeps ETC2, ~4x less GPU memory). A web build that ships only S3TC may lose
        # textures on mobile browsers without S3TC, so the default web build uses lossless; run the workflow manually with
        # cantor_textures=vram to publish the compressed variant for comparison. Nothing is removed from the repo either way.
        if: ${{ inputs.cantor_textures != 'vram' }}
        run: |
          tools/set_cantor_textures.sh lossless
          godot --headless --editor --import --quit

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          ls -la build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    # Production deployment is restricted to main, including manual workflow_dispatch runs started from any other branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
