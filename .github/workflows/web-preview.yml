name: Web Preview

# Builds the Godot web export and publishes it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and web export templates
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 3 -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot 2>/dev/null || sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot 2>/dev/null || sudo chmod +x /usr/local/bin/godot
          TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATES"
          unzip -q -j templates.tpz 'templates/web_*' 'templates/version.txt' -d "$TEMPLATES"
          rm -f godot.zip templates.tpz
          godot --version
          ls "$TEMPLATES"

      - name: Import project
        run: godot --headless --editor --import --quit

      - name: Run tests
        run: |
          godot --headless --script res://tests/test_phase1.gd
          godot --headless --script res://tests/test_repairs.gd
          godot --headless --script res://tests/test_adventure.gd
          godot --headless --script res://tests/test_sprites.gd
          godot --headless --script res://tests/test_hero_sprites.gd
          godot --headless --script res://tests/test_mira_sprites.gd
          godot --headless --script res://tests/test_shade_sprites.gd
          godot --headless --script res://tests/test_enforcer_sprites.gd
          godot --headless --script res://tests/test_boss_transform.gd
          godot --headless --script res://tests/test_ui_polish.gd
          godot --headless --script res://tests/test_release_candidate.gd
          godot --headless --script res://tests/test_episode_defs.gd
          godot --headless --script res://tests/test_episode2.gd

      - name: Sprite pipeline tests
        run: |
          pip install numpy pillow
          python3 tools/test_slice_sheet.py
          GODOT=godot tools/test_pipeline.sh
          rm -rf tests/fixtures/_pipeline

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          ls -la build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
